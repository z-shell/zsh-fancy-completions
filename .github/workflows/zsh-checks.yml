---
name: "Zsh Checks"
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "**/*.zsh"
      - "**/*.zunit"
      - ".github/workflows/zsh-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.zsh"
      - "**/*.zunit"
      - ".github/workflows/zsh-checks.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zsh-matrix:
    runs-on: ubuntu-latest
    outputs:
      output1: ${{ steps.set-matrix.outputs.files }}
    steps:
      - name: "⤵️ Check out code from GitHub"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: "Set matrix output"
        id: set-matrix
        run: |
          MATRIX="$(find . -path ./.git -prune -o -path ./.trunk -prune -o \
            -type d -name 'doc' -prune -o \
            -type f -name '*.zsh' -print \
            | sort | jq -ncR '{"include": [{"file": inputs}]}')"
          echo "files=${MATRIX}" >> $GITHUB_OUTPUT

  zsh-n:
    runs-on: ubuntu-latest
    needs: zsh-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.zsh-matrix.outputs.output1) }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: "⚡ Install dependencies"
        run: sudo apt update && sudo apt-get install -yq zsh
      - name: "⚡ zsh -n: ${{ matrix.file }}"
        env:
          ZSH_FILE: ${{ matrix.file }}
        run: |
          zsh -n "${ZSH_FILE}"
      - name: "⚡ zcompile ${{ matrix.file }}"
        env:
          ZSH_FILE: ${{ matrix.file }}
        run: |
          zsh -fc "zcompile ${ZSH_FILE}"; rc=$?
          ls -al "${ZSH_FILE}.zwc"; exit "$rc"

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: "⚡ Install dependencies"
        run: sudo apt update && sudo apt-get install -yq zsh
      - name: Check out ZUnit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: z-shell/zunit
          ref: 15061c83373be80b523988121b7ba12c6b2d82dc # v0.8.2
          path: .zunit-tool
          persist-credentials: false
      - name: Build ZUnit
        run: |
          cd .zunit-tool
          zsh build.zsh
      - name: "🧪 Run test suite"
        run: |
          .zunit-tool/zunit --tap tests/*.zunit
