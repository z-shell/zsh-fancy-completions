---
name: Zsh Lint

on:
  push:
    branches: [main]
    paths:
      - "zsh-fancy-completions.plugin.zsh"
      - "functions/**"
      - "lib/**"
      - ".github/workflows/zsh-lint.yml"
  pull_request:
    branches: [main]
    paths:
      - "zsh-fancy-completions.plugin.zsh"
      - "functions/**"
      - "lib/**"
      - ".github/workflows/zsh-lint.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zsh-lint:
    name: Zsh Lint
    uses: z-shell/.github/.github/workflows/zsh-lint.yml@6dca2bef75c60106cde7237db5dea2c2eeed243b
    with:
      zsh-lint-ref: 900560008382fcdfbed9c2ff26129438d44a1359
      paths: |
        zsh-fancy-completions.plugin.zsh
        functions
        lib
